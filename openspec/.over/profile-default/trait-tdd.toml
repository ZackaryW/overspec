[[compiletime-trait]]
name = "tdd"
setting = "tdd"
attach = "context"
body = """
Before behavioral implementation, read and apply Superpowers' test-driven-development:
https://raw.githubusercontent.com/obra/superpowers/b36e0829c6d0140e93cfef2ca599b1b07d4a7797/skills/test-driven-development/SKILL.md
Read its sibling writing-good-tests.md at the same revision. Complete each
behavior through observed RED, minimal implementation, GREEN, then refactor;
report the evidence. If either reference is unavailable, report it and pause
behavioral implementation rather than claiming compliance.
"""
details = """
The pinned skill owns the TDD procedure, examples, deviation handling, and test
quality checks. Its required companion is:
https://raw.githubusercontent.com/obra/superpowers/b36e0829c6d0140e93cfef2ca599b1b07d4a7797/skills/test-driven-development/writing-good-tests.md

Read both pinned references, or verified local copies of that revision; an
installed skill with the same name is not proof of matching content. This trait
references external guidance; it does not install or vendor either document.

Apply to implementation behavior changes. Prose-only and mechanical edits without
behavior changes need appropriate verification, not artificial failing tests.
Any restart applies to newly authored work for the current behavior; preserve
preexisting and user-owned work. Framework selection belongs to separate traits.

The compile-time definition refreshes at init/update. The tdd boolean publication
switch is checked at sync; missing enables it and false disables it.
"""
