[[runtime-trait]]
name = "bdd-behave"
attach = "operations.apply.guidance"
body = """Follow the project's established Behave features, steps, fixtures, and environment hooks. Exercise observable behavior through its real public boundary using its configured runner.
"""
details = """Activated when the existing bdd list contains "behave" and bdd-behave is not false. Selection supplies guidance only; inspect the project's existing framework configuration, fixtures, runner, and prerequisites before using it. It does not install tools or automatically parse manifests.
"""

[[runtime-trait.assert.1.assertion]]
type = "~runtime-context-match"
kv = "bdd-behave=false"

[[runtime-trait.assert.1.assertion]]
type = "runtime-context-includes"
k = "bdd"
includes = "behave"
