[[runtime-trait]]
name = "decision-propose"
attach = "operations.propose.guidance"
body = """Resolve material scope and behavior choices with evidence-backed prompts before proposing dependent work. Wait for explicit answers and preserve decisions already settled during exploration.
"""
details = """Use the available user-input panel when supported. Keep the request concrete and explain why it matters. Do not re-open accepted choices without new conflicting evidence; unanswered prompts remain pending.
"""

