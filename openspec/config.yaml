schema: overspec

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

# Guidance comes from profile-default; edit traits and run overspec sync.
operations:
  apply:
    guidance:
      - | # over:bdd-behave,bdd-cucumber,bdd-flutter,evidence-apply,integration-test-policies
        From this project's root, run:
        overspec trait resolve --resolution 4da47f779cc7e51239dee52b45a53d227c97637d5145bc32655d7a7b9a618457 --attach operations.apply.guidance --trait bdd-behave --trait bdd-cucumber --trait bdd-flutter --trait evidence-apply --trait integration-test-policies
        Supply --context-file <path> when current invocation context is available, and apply the returned guidance to this operation.
        For an active change, obtain changeRoot from OpenSpec using openspec status --change <name> --json (preserving the selected --store), then append --change-root <changeRoot> to this command. Without a selected change, use project variables only.
  archive:
    guidance:
      - | # over:zmem-archive
        Ask the user to choose: discard, archive normally, dissolve into zmem, or only form specs.
        Wait for their answer before changing lifecycle artifacts. Commit OpenSpec artifacts
        retained by the chosen outcome; use zmem-author-commits for the final review when available.
      - | # over:do-not-archive-openspec-change
        From this project's root, run:
        overspec trait resolve --resolution 4da47f779cc7e51239dee52b45a53d227c97637d5145bc32655d7a7b9a618457 --attach operations.archive.guidance --trait do-not-archive-openspec-change
        Supply --context-file <path> when current invocation context is available, and apply the returned guidance to this operation.
        For an active change, obtain changeRoot from OpenSpec using openspec status --change <name> --json (preserving the selected --store), then append --change-root <changeRoot> to this command. Without a selected change, use project variables only.
rules:
  proposal:
    - | # over:decision-propose,prototype-propose
      From this project's root, run:
      overspec trait resolve --resolution 4da47f779cc7e51239dee52b45a53d227c97637d5145bc32655d7a7b9a618457 --attach rules.proposal --trait decision-propose --trait prototype-propose
      Supply --context-file <path> when current invocation context is available, and apply the returned guidance to this operation.
      For an active change, obtain changeRoot from OpenSpec using openspec status --change <name> --json (preserving the selected --store), then append --change-root <changeRoot> to this command. Without a selected change, use project variables only.
  tasks:
    - | # over:evidence-tasks,utility-mature
      From this project's root, run:
      overspec trait resolve --resolution 4da47f779cc7e51239dee52b45a53d227c97637d5145bc32655d7a7b9a618457 --attach rules.tasks --trait evidence-tasks --trait utility-mature
      Supply --context-file <path> when current invocation context is available, and apply the returned guidance to this operation.
      For an active change, obtain changeRoot from OpenSpec using openspec status --change <name> --json (preserving the selected --store), then append --change-root <changeRoot> to this command. Without a selected change, use project variables only.
  design:
    - | # over:utility-plan
      From this project's root, run:
      overspec trait resolve --resolution 4da47f779cc7e51239dee52b45a53d227c97637d5145bc32655d7a7b9a618457 --attach rules.design --trait utility-plan
      Supply --context-file <path> when current invocation context is available, and apply the returned guidance to this operation.
      For an active change, obtain changeRoot from OpenSpec using openspec status --change <name> --json (preserving the selected --store), then append --change-root <changeRoot> to this command. Without a selected change, use project variables only.
context: |
  Use codegraph for current code structure and zmem for decisions and lessons.
  Before changing behavior, resolve the symbol with codegraph and recall zmem for
  its file or module. Keep repository memory authoritative in zmem and record new
  decisions and lessons on the commit carrying the change.
  <!-- over:require-zmem -->

  Invoke zmem-author-commits after each verified source implementation milestone
  for implementation commits and durable memory. Include .over, config, tests, and
  all other nonignored work; exclude only the active change's own artifacts.
  <!-- over:zmem-commits -->

  From this project's root, run:
  overspec trait resolve --resolution 4da47f779cc7e51239dee52b45a53d227c97637d5145bc32655d7a7b9a618457 --attach context --trait decision-explore --trait prototype-explore --trait tdd --trait zuu
  Supply --context-file <path> when current invocation context is available, and apply the returned guidance to this operation.
  For an active change, obtain changeRoot from OpenSpec using openspec status --change <name> --json (preserving the selected --store), then append --change-root <changeRoot> to this command. Without a selected change, use project variables only.
  <!-- over:decision-explore,prototype-explore,tdd,zuu -->
