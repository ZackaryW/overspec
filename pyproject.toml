[project]
name = "overspec"
version = "0.1.0"
description = "Compose reusable traits into native OpenSpec project guidance"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "gitzackw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "packaging>=24",
    "rich>=15.0.0",
    "ruamel-yaml>=0.18",
    "tomlkit>=0.13",
    "typer>=0.27.2",
    "zuat",
    "zuu",
]

[project.scripts]
overspec = "overspec:main"

[project.optional-dependencies]
saucepan = ["saucepan-sdk @ git+https://github.com/ZackaryW/saucepan@43ba58936c48c3daf00e0e1cd25b870d4869731a#subdirectory=sdk/python"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/overspec"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "pyproject.toml", "README.md", "uv.lock", "hatch_build.py"]

[tool.uv.sources]
zuat = { git = "https://github.com/ZackaryW/zuat" }
zuu = { git = "https://github.com/ZackaryW/zuu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
